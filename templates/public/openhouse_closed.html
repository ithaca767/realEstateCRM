{% extends "base.html" %}

{% block title %}Open House Sign-In Closed{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card mt-4">
      <div class="card-body text-center py-5">
        <h2 class="mb-3">Open House Sign-In Closed</h2>
        <p class="mb-1">This open house sign-in is no longer active.</p>
        <div class="text-muted">
          {{ openhouse["address_line1"] }}, {{ openhouse["city"] }}, {{ openhouse["state"] }} {{ openhouse["zip"] }}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
